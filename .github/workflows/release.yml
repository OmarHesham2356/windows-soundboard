name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to attach the build to (defaults to v<date>)
        required: false

permissions:
  contents: write

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  release:
    name: Build and publish
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish self-contained build
        run: >
          dotnet publish src/WindowsSoundboard/WindowsSoundboard.csproj
          -c Release -p:Platform=x64 -r win-x64 --self-contained true
          -o dist

      - name: Package
        shell: pwsh
        run: |
          Compress-Archive -Path dist\* -DestinationPath WindowsSoundboard-win-x64.zip -Force
          Get-FileHash WindowsSoundboard-win-x64.zip -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash)  WindowsSoundboard-win-x64.zip" } |
            Set-Content SHA256SUMS.txt
          Get-Content SHA256SUMS.txt

      - name: Attach to the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.event.inputs.tag }}"
          if (-not $tag) {
            if ("${{ github.event_name }}" -eq "push") { $tag = "${{ github.ref_name }}" }
            else { $tag = "v" + (Get-Date -Format "yyyy.MM.dd") }
          }
          Write-Output "Publishing to release $tag"
          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title "Windows Soundboard $tag" --generate-notes --target "${{ github.sha }}"
          }
          gh release upload $tag "WindowsSoundboard-win-x64.zip" "SHA256SUMS.txt" --clobber
