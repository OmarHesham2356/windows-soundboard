name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  build:
    name: Build (win-x64)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore src/WindowsSoundboard/WindowsSoundboard.csproj

      - name: Build
        run: dotnet build src/WindowsSoundboard/WindowsSoundboard.csproj -c Release -p:Platform=x64 --no-restore

      # An unpackaged WinUI app dies at startup (stowed exception 0xC000027B) when
      # publish drops the resource index or the compiled XAML, so publish is checked
      # here rather than only when a release is cut.
      - name: Publish self-contained and check layout
        shell: pwsh
        run: |
          dotnet publish src/WindowsSoundboard/WindowsSoundboard.csproj -c Release `
            -p:Platform=x64 -r win-x64 --self-contained true -o dist
          if (-not (Test-Path dist/WindowsSoundboard.exe)) { throw "publish produced no executable" }
          if (-not (Test-Path dist/WindowsSoundboard.pri)) { throw "publish dropped WindowsSoundboard.pri" }
          if (-not (Get-ChildItem dist -Filter *.xbf -ErrorAction SilentlyContinue)) { throw "publish dropped the compiled XAML" }
          Write-Output "publish layout ok"

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: WindowsSoundboard-debug-build
          path: src/WindowsSoundboard/bin/x64/Release/net10.0-windows10.0.19041.0/win-x64/
          if-no-files-found: error
