name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  build:
    name: Build (win-x64)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore src/WindowsSoundboard/WindowsSoundboard.csproj

      - name: Build
        run: dotnet build src/WindowsSoundboard/WindowsSoundboard.csproj -c Release -p:Platform=x64 --no-restore

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: WindowsSoundboard-debug-build
          path: src/WindowsSoundboard/bin/x64/Release/net10.0-windows10.0.19041.0/win-x64/
          if-no-files-found: error
